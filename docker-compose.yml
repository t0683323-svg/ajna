version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ajna_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Warsaw
      - NODE_ENV=production
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - qdrant
      - ollama
      - ghost

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ajna_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: ajna_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama

  ghost:
    image: ghost:5-alpine
    container_name: ajna_ghost
    restart: unless-stopped
    ports:
      - "2368:2368"
    environment:
      url: http://localhost:2368
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ajna_password
      database__connection__database: ghost
      NODE_ENV: development
    volumes:
      - ./ghost_content:/var/lib/ghost/content
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ajna_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ajna_password
    volumes:
      - ./mysql_data:/var/lib/mysql

networks:
  default:
    name: ajna_network
